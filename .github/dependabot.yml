# Патчи и минорные — одним PR, их можно мерджить по зелёному CI не глядя.
# Мажорные — каждый своим PR: у них ломающие изменения, и они не должны
# ехать в одном PR вместе с безобидными обновлениями по принципу «всё или ничего».
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      safe:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      safe:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message: { prefix: "build(deps)" }
    ignore:
      # Проверено 30.07.2026 на реальной сборке — оба мажора ломают линт:
      #   eslint 10     → scopeManager.addGlobals is not a function
      #   typescript 7  → typescript-eslint does not support TS 7.0
      # Снять запрет, когда eslint-config-next объявит поддержку.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Типы Node должны совпадать с рантаймом (24.x), а не опережать его.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci(deps)" }

  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: monthly }
    ignore:
      # Мажор Python меняет рантайм образа, а CI продолжает тестировать на 3.12.
      # Обновляется осознанно и вместе: Dockerfile + CI + requires-python.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: monthly }
    ignore:
      # Только LTS: чётные версии Node. Нечётные (25, 27) живут полгода
      # и не получают долгосрочных обновлений безопасности.
      # Плюс рантайм образа обязан совпадать с .nvmrc и CI.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
