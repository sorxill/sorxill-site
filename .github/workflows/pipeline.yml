# Один пайплайн: проверки → образы → деплой.
# Деплой физически не может произойти, если тесты не прошли: он в конце цепочки needs.
# Работаем прямо в main, без PR к самому себе — гейтом служит этот файл.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "SHA для откката (пусто = обычный деплой)"
        required: false

concurrency:
  group: pipeline-${{ github.ref }}
  # Отменяем только проверки. Деплой имеет свою группу ниже: прерванный
  # на середине rollout оставит сервер в неопределённом состоянии.
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - name: границы слоёв
        run: lint-imports
      - name: тесты
        run: pytest --cov-report=xml --cov-report=html --junit-xml=junit.xml
      - name: сводка в отчёт прогона
        if: always()
        run: |
          {
            echo "### Бэкенд"
            echo '```'
            python -c "import xml.etree.ElementTree as E;r=E.parse('coverage.xml').getroot();print(f\"покрытие: {float(r.get('line-rate'))*100:.1f}%\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: артефакты при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/htmlcov
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: бюджет бандла 120 КБ
        run: |
          {
            echo "### Фронтенд"
            echo '```'
            npx size-limit
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npx size-limit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  images:
    needs: [api, web, secrets]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { app: [api, web] }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sorxill-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/sorxill-${{ matrix.app }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://sorxill.ru
    steps:
      - uses: actions/checkout@v7

      - name: SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_A_HOST }} >> ~/.ssh/known_hosts

      - name: Синхронизация infra
        run: rsync -az --delete -e ssh infra/ deploy@${{ secrets.SERVER_A_HOST }}:/opt/sorxill/infra/

      # Единственный источник правды по секретам — GitHub Environment production.
      # Сервер получает производную копию: руками .env не редактируется никогда.
      # Ротация = gh secret set + повторный запуск пайплайна.
      - name: Разложить .env на сервере
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          IP_PEPPER: ${{ secrets.IP_PEPPER }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          UMAMI_SECRET: ${{ secrets.UMAMI_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GH_TOKEN_READONLY: ${{ secrets.GH_TOKEN_READONLY }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          umask 077
          {
            echo "APP_ENV=production"
            echo "DOMAIN=${{ vars.DOMAIN }}"
            echo "GH_OWNER=${{ github.repository_owner }}"
            echo "ACME_EMAIL=${{ vars.ACME_EMAIL }}"
            echo "API_TAG=${{ github.sha }}"
            echo "WEB_TAG=${{ github.sha }}"
            echo "POSTGRES_DB=sorxill"
            echo "POSTGRES_USER=sorxill"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "SECRET_KEY=$SECRET_KEY"
            echo "IP_PEPPER=$IP_PEPPER"
            echo "REVALIDATE_SECRET=$REVALIDATE_SECRET"
            echo "UMAMI_SECRET=$UMAMI_SECRET"
            echo "CONTACT_PERSIST=${{ vars.CONTACT_PERSIST || 'false' }}"
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=587"
            echo "SMTP_USER=$SMTP_USER"
            echo "SMTP_PASSWORD=$SMTP_PASSWORD"
            echo "GITHUB_TOKEN=$GH_TOKEN_READONLY"
            echo "GRAFANA_CLOUD_TOKEN=$GRAFANA_CLOUD_TOKEN"
            echo "SENTRY_DSN=$SENTRY_DSN"
          } > env.render
          scp -q env.render deploy@${{ secrets.SERVER_A_HOST }}:/opt/sorxill/.env.new
          ssh deploy@${{ secrets.SERVER_A_HOST }} \
            "chmod 600 /opt/sorxill/.env.new && mv /opt/sorxill/.env.new /opt/sorxill/.env"
          shred -u env.render

      - name: Rollout с health-gate и автооткатом
        env: { TAG: "${{ inputs.rollback_sha || github.sha }}" }
        run: ssh deploy@${{ secrets.SERVER_A_HOST }} "cd /opt/sorxill && ./infra/scripts/rollout.sh $TAG"

      - name: Smoke снаружи
        run: |
          set -e
          curl -fsS --max-time 10 https://${{ vars.DOMAIN }}/ru > /dev/null
          curl -fsS --max-time 10 https://${{ vars.DOMAIN }}/api/v1/projects > /dev/null
          curl -fsSI https://${{ vars.DOMAIN }} | grep -qi strict-transport-security

      - name: Итог в сводке запуска
        if: always()
        run: |
          {
            echo "## Деплой ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Образ | \`${GITHUB_SHA::7}\` |"
            echo "| Сайт | https://${{ vars.DOMAIN }} |"
            echo "| Откат | \`gh workflow run pipeline.yml -f rollback_sha=<sha>\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Уведомление в Telegram
        if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT }}" \
            -d text="deploy FAILED · ${GITHUB_SHA::7} · https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
